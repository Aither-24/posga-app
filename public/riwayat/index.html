<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Riwayat Peserta | POSGA</title>
  <link rel="stylesheet" href="/css/output.css">
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/riwayat.js" defer></script>
  <script src="/js/alpine.js" defer></script>
</head>

<body data-page="riwayat" data-auth="private" x-data="posgaLayout" x-init="init()">
  <aside class="fixed inset-y-0 left-0 z-50 hidden w-64 flex-col border-r border-slate-200 bg-white lg:flex">
    <div class="flex h-20 shrink-0 items-center gap-3 border-b border-slate-100 px-6">
      <div class="grid size-11 shrink-0 place-items-center rounded-2xl bg-emerald-600 text-base font-bold text-white shadow-sm" aria-hidden="true">P</div>
      <div class="min-w-0">
        <p class="text-lg font-bold leading-5 text-slate-950">POSGA</p>
        <p class="mt-1 truncate text-xs text-slate-500">Sistem Pelayanan Posyandu</p>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 py-5" aria-label="Navigasi utama">
      <template x-for="item in navigasi" :key="item.id">
        <a
          :href="item.href"
          class="posga-nav-item"
          :class="halamanAktif===item.id?'posga-nav-item-active':''"
          :aria-current="halamanAktif===item.id?'page':null"
        >
          <span class="size-5 shrink-0" x-html="iconSvg(item.icon)"></span>
          <span class="truncate" x-text="item.label"></span>
        </a>
      </template>
    </nav>

    <div class="shrink-0 border-t border-slate-100 px-4 py-4">
      <div class="flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-2.5">
        <div class="grid size-9 shrink-0 place-items-center rounded-full bg-emerald-100 text-xs font-bold text-emerald-700" x-text="inisialUser"></div>
        <div class="min-w-0">
          <p class="truncate text-xs font-semibold text-slate-800" x-text="user.nama || user.username || 'Pengguna'"></p>
          <p class="truncate text-[10px] text-slate-500" x-text="user.role==='admin'?'Administrator':'Petugas'"></p>
        </div>
      </div>
    </div>
  </aside>

  <div class="min-h-screen lg:pl-64">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95">
      <div class="flex h-20 items-center justify-between px-4 sm:px-6 lg:px-8">
        <div>
          <p class="text-xs font-semibold uppercase tracking-[.12em] text-emerald-600">Pelayanan</p>
          <h1 class="text-xl font-bold">Riwayat Peserta</h1>
        </div>

        <div class="relative">
  <button
    type="button"
    class="grid size-10 shrink-0 place-items-center rounded-full bg-emerald-100 text-sm font-bold text-emerald-700"
    x-text="inisialUser"
    :title="user?.nama || user?.username || 'Akun POSGA'"
    :aria-label="`Akun ${user?.nama || user?.username || 'POSGA'}`"
    @click="akunTerbuka = !akunTerbuka"
  ></button>

  <div
    x-cloak
    x-show="akunTerbuka"
    @click.outside="akunTerbuka = false"
    x-transition
    class="absolute right-0 z-50 mt-2 w-56 rounded-xl border border-slate-200 bg-white p-2 shadow-lg"
  >
    <div class="border-b border-slate-100 px-3 py-2">
      <p
        class="truncate text-sm font-semibold text-slate-900"
        x-text="user?.nama || user?.username || 'Pengguna'"
      ></p>

      <p
        class="mt-0.5 truncate text-xs text-slate-500"
        x-text="user?.role === 'admin' ? 'Administrator' : 'Petugas'"
      ></p>
    </div>

    <button
      type="button"
      class="mt-1 w-full rounded-lg px-3 py-2 text-left text-sm font-semibold text-red-600 hover:bg-red-50"
      @click="logout()"
    >
      Keluar
    </button>
  </div>
</div>
      </div>
    </header>

    <main
      x-data="riwayatPage"
      x-init="init()"
      class="px-4 py-5 sm:px-6 lg:px-8"
    >
      <div class="mx-auto max-w-[1500px]">
        <div
          x-cloak
          x-show="error"
          class="posga-alert-error mb-4" role="alert" aria-live="assertive"
          x-text="error"
        ></div>

        <div class="grid min-h-[calc(100vh-7rem)] gap-4 xl:grid-cols-[330px_minmax(0,1fr)]">
          <!-- PESERTA -->
          <section class="posga-card flex min-h-0 flex-col overflow-hidden">
            <div class="border-b border-slate-200 p-4">
              <h2 class="font-bold text-slate-950">Peserta</h2>
              <p class="mt-0.5 text-xs text-slate-500">Cari nama atau NIK.</p>

              <form
                class="mt-3"
                @submit.prevent="muatPeserta()"
              >
                <input
                  type="search"
                  class="posga-input"
                  placeholder="Cari peserta..."
                  x-model="pencarian"
                  @input.debounce.350ms="muatPeserta()"
                >
              </form>
            </div>

            <div
              x-show="loadingPeserta"
              class="p-5 text-sm text-slate-500"
             role="status" aria-live="polite">
              Memuat peserta...
            </div>

            <div
              x-cloak
              x-show="!loadingPeserta && peserta.length===0"
              class="p-6 text-center text-sm text-slate-500"
             role="status" aria-live="polite">
              Peserta tidak ditemukan.
            </div>

            <div
              x-cloak
              x-show="!loadingPeserta && peserta.length>0"
              class="min-h-0 flex-1 overflow-y-auto p-2"
             role="status" aria-live="polite">
              <template x-for="item in peserta" :key="item.nik">
                <button
                  type="button"
                  class="mb-1 w-full rounded-xl border px-3 py-3 text-left transition"
                  :class="pesertaAktif?.nik===item.nik
                    ? 'border-emerald-300 bg-emerald-50'
                    : 'border-transparent hover:border-slate-200 hover:bg-slate-50'"
                  @click="pilihPeserta(item)"
                >
                  <p
                    class="truncate text-sm font-semibold text-slate-900"
                    x-text="item.nama"
                  ></p>

                  <p
                    class="mt-0.5 truncate text-[11px] text-slate-500"
                    x-text="item.nik"
                  ></p>

                  <div class="mt-2 flex items-center justify-between gap-2">
                    <span
                      class="truncate text-[11px] text-slate-500"
                      x-text="item.posyanduNama || 'Belum ada Posyandu'"
                    ></span>

                    <span
                      class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-semibold"
                      :class="item.aktif?'bg-emerald-100 text-emerald-700':'bg-slate-100 text-slate-500'"
                      x-text="item.aktif?'Aktif':'Nonaktif'"
                    ></span>
                  </div>
                </button>
              </template>
            </div>
          </section>

          <!-- RIWAYAT -->
          <section class="posga-card min-w-0 overflow-hidden">
            <div
              x-show="!pesertaAktif"
              class="grid min-h-[520px] place-items-center p-8 text-center"
            >
              <div>
                <p class="font-semibold text-slate-800">Pilih peserta</p>
                <p class="mt-1 text-sm text-slate-500">Riwayat pelayanan akan muncul di sini.</p>
              </div>
            </div>

            <div x-cloak x-show="pesertaAktif">
              <div class="border-b border-slate-200 p-4 sm:p-5">
                <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                  <div class="min-w-0">
                    <p
                      class="truncate text-lg font-bold text-slate-950"
                      x-text="pesertaAktif?.nama"
                    ></p>
                    <p class="mt-1 text-xs text-slate-500">
                      <span x-text="pesertaAktif?.nik"></span>
                      <span class="mx-1">•</span>
                      <span x-text="labelJK(pesertaAktif?.jenisKelamin)"></span>
                      <span class="mx-1">•</span>
                      <span x-text="formatTanggal(pesertaAktif?.tanggalLahir)"></span>
                    </p>
                  </div>

                  <div class="flex flex-wrap gap-2">
                    <select class="posga-input !w-auto" x-model="filter.statusPemeriksaan" @change="muatRiwayat(1)">
                      <option value="">Semua status</option>
                      <option value="selesai">Selesai</option>
                      <option value="sedang_diperiksa">Sedang diperiksa</option>
                      <option value="belum_diperiksa">Belum diperiksa</option>
                      <option value="tidak_hadir">Tidak hadir</option>
                      <option value="batal">Batal</option>
                    </select>

                    <input
                      type="date"
                      class="posga-input !w-auto"
                      x-model="filter.tanggalMulai"
                      @change="muatRiwayat(1)"
                      title="Tanggal mulai"
                    >

                    <input
                      type="date"
                      class="posga-input !w-auto"
                      x-model="filter.tanggalSelesai"
                      @change="muatRiwayat(1)"
                      title="Tanggal selesai"
                    >
                  </div>
                </div>

                <div class="mt-4 grid grid-cols-3 gap-2">
                  <div class="rounded-xl bg-slate-50 px-3 py-2">
                    <p class="text-[10px] font-semibold uppercase text-slate-400">Sesi</p>
                    <p class="mt-0.5 text-lg font-bold text-slate-800" x-text="pagination.total"></p>
                  </div>
                  <div class="rounded-xl bg-slate-50 px-3 py-2">
                    <p class="text-[10px] font-semibold uppercase text-slate-400">Halaman</p>
                    <p class="mt-0.5 text-lg font-bold text-slate-800" x-text="pagination.totalPages || 0"></p>
                  </div>
                  <div class="rounded-xl bg-slate-50 px-3 py-2">
                    <p class="text-[10px] font-semibold uppercase text-slate-400">Posyandu</p>
                    <p class="mt-1 truncate text-xs font-semibold text-slate-700" x-text="pesertaAktif?.posyanduNama || '-'"></p>
                  </div>
                </div>
              </div>

              <div
                x-show="loadingRiwayat"
                class="p-8 text-sm text-slate-500"
               role="status" aria-live="polite">
                Memuat riwayat...
              </div>

              <div
                x-cloak
                x-show="!loadingRiwayat && riwayat.length===0"
                class="p-10 text-center text-sm text-slate-500"
               role="status" aria-live="polite">
                Belum ada riwayat sesuai filter.
              </div>

              <div
                x-cloak
                x-show="!loadingRiwayat && riwayat.length>0"
                class="divide-y divide-slate-100"
               role="status" aria-live="polite">
                <template x-for="item in riwayat" :key="item.pesertaSesiId">
                  <article class="p-4 sm:p-5">
                    <button
                      type="button"
                      class="w-full text-left"
                      @click="toggleDetail(item)"
                    >
                      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                        <div class="min-w-0">
                          <div class="flex flex-wrap items-center gap-2">
                            <p
                              class="font-bold text-slate-900"
                              x-text="formatTanggal(item.tanggalPosga)"
                            ></p>

                            <span
                              class="rounded-full bg-slate-100 px-2 py-0.5 text-[10px] font-semibold text-slate-600"
                              x-text="labelKategori(item.kategori)"
                            ></span>

                            <span
                              class="rounded-full px-2 py-0.5 text-[10px] font-semibold"
                              :class="statusClass(item.statusPemeriksaan)"
                              x-text="labelStatus(item.statusPemeriksaan)"
                            ></span>
                          </div>

                          <p
                            class="mt-1 truncate text-xs text-slate-500"
                            x-text="item.namaPosyandu"
                          ></p>
                        </div>

                        <div class="grid shrink-0 grid-cols-3 gap-2 text-center">
                          <div class="rounded-lg bg-slate-50 px-2 py-1.5">
                            <p class="text-[10px] text-slate-400">Periksa</p>
                            <p class="text-sm font-bold" x-text="item.klinis.jumlahPemeriksaan"></p>
                          </div>
                          <div class="rounded-lg bg-slate-50 px-2 py-1.5">
                            <p class="text-[10px] text-slate-400">Skrining</p>
                            <p class="text-sm font-bold" x-text="item.klinis.jumlahSkrining"></p>
                          </div>
                          <div class="rounded-lg bg-slate-50 px-2 py-1.5">
                            <p class="text-[10px] text-slate-400">Konseling</p>
                            <p class="text-sm font-bold" x-text="item.klinis.jumlahKonseling"></p>
                          </div>
                        </div>
                      </div>
                    </button>

                    <div
                      x-cloak
                      x-show="detailTerbukaId===item.pesertaSesiId"
                      class="mt-4 rounded-xl border border-slate-200 bg-slate-50/60 p-3 sm:p-4"
                    >
                      <div class="mb-3 flex items-center justify-end" x-show="item.statusSesi !== 'dibatalkan'">
                        <a
                          class="posga-button-secondary"
                          :href="urlKoreksi(item)"
                        >
                          Koreksi data
                        </a>
                      </div>
                      <div x-show="loadingDetail" class="py-4 text-sm text-slate-500" role="status" aria-live="polite">
                        Memuat detail...
                      </div>

                      <div
                        x-cloak
                        x-show="!loadingDetail && detailForm"
                        class="grid gap-4"
                       role="status" aria-live="polite">
                        <section>
                          <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-500">Pemeriksaan</h4>
                          <div class="grid gap-2 md:grid-cols-2">
                            <template x-for="x in hasilBagian('pemeriksaan')" :key="`p-${x.indikatorId}`">
                              <div class="flex items-start justify-between gap-3 rounded-lg bg-white px-3 py-2">
                                <span class="text-xs text-slate-500" x-text="labelIndikator(x)"></span>
                                <span class="text-right text-xs font-semibold text-slate-800" x-text="nilaiItem(x)"></span>
                              </div>
                            </template>
                          </div>
                          <p x-show="hasilBagian('pemeriksaan').length===0" class="text-xs text-slate-400">Tidak ada hasil.</p>
                        </section>

                        <section>
                          <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-500">Skrining</h4>
                          <div class="grid gap-2 md:grid-cols-2">
                            <template x-for="x in hasilBagian('skrining')" :key="`s-${x.indikatorId}`">
                              <div class="flex items-start justify-between gap-3 rounded-lg bg-white px-3 py-2">
                                <span class="text-xs text-slate-500" x-text="x.nama"></span>
                                <span class="text-right text-xs font-semibold text-slate-800" x-text="nilaiItem(x)"></span>
                              </div>
                            </template>
                          </div>
                          <p x-show="hasilBagian('skrining').length===0" class="text-xs text-slate-400">Tidak ada hasil sesi ini.</p>
                        </section>

                        <section>
                          <h4 class="mb-2 text-xs font-bold uppercase tracking-wide text-slate-500">Konseling</h4>
                          <div class="grid gap-2">
                            <template x-for="x in hasilBagian('konseling')" :key="`k-${x.indikatorId}`">
                              <div class="rounded-lg bg-white px-3 py-2">
                                <p class="text-xs text-slate-500" x-text="x.nama"></p>
                                <p class="mt-1 text-xs font-semibold text-slate-800" x-text="nilaiItem(x)"></p>
                              </div>
                            </template>
                          </div>
                          <p x-show="hasilBagian('konseling').length===0" class="text-xs text-slate-400">Tidak ada konseling sesi ini.</p>
                        </section>
                      </div>
                    </div>
                  </article>
                </template>
              </div>

              <div
                x-cloak
                x-show="pagination.totalPages>1"
                class="flex items-center justify-between border-t border-slate-200 p-4"
              >
                <button
                  type="button"
                  class="posga-button-secondary"
                  :disabled="!pagination.hasPrevious"
                  @click="muatRiwayat(pagination.page-1)"
                >
                  ← Sebelumnya
                </button>

                <span
                  class="text-xs text-slate-500"
                  x-text="`${pagination.page} / ${pagination.totalPages}`"
                ></span>

                <button
                  type="button"
                  class="posga-button-secondary"
                  :disabled="!pagination.hasNext"
                  @click="muatRiwayat(pagination.page+1)"
                >
                  Berikutnya →
                </button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
